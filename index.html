<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Representante – Faltas e Clientes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E4F20">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5EC;--sf:#fff;--ink:#1C2014;--mu:#5D6352;--ln:#DFE3D3;--ol:#556B2F;--old:#3E4F20;--oll:#E8EDDC;--olt:#D9E4B5;--wa:#15803D;--rd:#B91C1C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(env(safe-area-inset-bottom) + 170px)}
.appbar{position:sticky;top:0;z-index:8;margin:0 -16px 8px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:64px}
.appbar.big{padding-top:calc(env(safe-area-inset-top) + 22px)}
.appbar h1{flex:1;min-width:0}
.ibtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex:none}
.ibtn:active{background:var(--oll)}
h1{font-family:'Space Grotesk',Inter,sans-serif;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1.15}
h2{font-size:17px;margin:0}
.sub{color:var(--mu);font-size:14px;margin:4px 0 0;line-height:1.45}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px}
.hero{background:var(--old);color:#fff;border-radius:22px;padding:18px}
.hero .eyebrow{color:var(--olt)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap;flex:none}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid #C9CFB8;background:#fff;color:var(--old);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;line-height:1.2;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ol);border-color:var(--ol);color:#fff}
.btn.dk{background:var(--old);border-color:var(--old);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.tint{background:var(--oll);border-color:var(--oll)}
.btn.danger{color:var(--rd);border-color:#F1B4B4}
.btn.dangerfill{background:var(--rd);border-color:var(--rd);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px}
.stat span{font-size:12px;color:var(--mu)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t{font-weight:600;font-size:15px;line-height:1.3}
.m{font-size:13px;color:var(--mu);margin-top:3px;line-height:1.4}
.list{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid #CDD3BD;background:#fff;color:var(--old);font-weight:600;font-size:14px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ol);color:#fff;border-color:var(--ol)}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;background:#fff;border:1px solid #D3D8C4;border-radius:24px;color:var(--mu)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);min-width:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.inp{min-height:48px;padding:10px 14px;border:1px solid #C9CFB8;border-radius:14px;background:#fff;font-size:16px;font-weight:400;width:100%}
.inp:focus{outline:2px solid var(--ol);outline-offset:0;border-color:var(--ol)}
textarea.inp{min-height:84px;resize:vertical}
.hint{font-size:13px;color:var(--mu);font-weight:400}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#FBFCF7;border-top:1px solid var(--ln);display:flex;justify-content:center;padding:8px 4px calc(env(safe-area-inset-bottom) + 8px);z-index:10}
nav.tabs button{flex:1;max-width:110px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--mu);cursor:pointer;position:relative;padding:0}
nav.tabs .pill{width:60px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .15s}
nav.tabs button[aria-current="page"]{color:var(--old);font-weight:700}
nav.tabs button[aria-current="page"] .pill{background:var(--olt)}
.badge{position:absolute;top:-4px;left:calc(50% + 8px);background:#C2410C;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.fab{position:fixed;right:max(16px, calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:9;height:56px;padding:0 20px;border-radius:18px;background:var(--old);color:#fff;border:0;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(62,79,32,.35);cursor:pointer}
.fab:active{transform:scale(.97)}
.ovl{position:fixed;inset:0;background:rgba(28,32,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease-out}
.handle{width:40px;height:4px;border-radius:2px;background:#CDD3BD;margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:20px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 156px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;z-index:30;max-width:90vw;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{text-align:center;color:var(--mu);padding:22px 12px;font-size:14px;line-height:1.5}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #EEF0E6;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ol);margin-top:1px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.note{background:#FBF8E8;border:1px solid #EADFA8;border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.note small{color:#6B5A12;font-weight:600}
details summary{cursor:pointer;font-weight:600;color:var(--old);min-height:44px;display:flex;align-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:#E3E8D5;border-radius:14px}
.seg button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:600;color:#4A5040;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spin{width:20px;height:20px;border:2.5px solid #CDD3BD;border-top-color:var(--ol);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid #EEF0E6;font-size:14px;align-items:center}
.line:first-child{border-top:0}
a{color:var(--ol)}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer;width:100%;font:inherit}
.linkbtn.line{padding:12px 0;border-top:1px solid #EEF0E6;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.linkbtn.line:first-child{border-top:0}
.menu .linkbtn{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid #EEF0E6}
.menu .linkbtn:first-child{border-top:0}
.mic{width:40px;height:40px;border-radius:12px;background:var(--oll);color:var(--old);display:flex;align-items:center;justify-content:center;flex:none}
.num{width:28px;height:28px;border-radius:14px;background:var(--oll);color:var(--old);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.num.ok{background:var(--ol);color:#fff}
.sug{display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.sug button{border:0;border-top:1px solid #EEF0E6;background:#fff;text-align:left;padding:10px 14px;cursor:pointer;font-size:14px}
.sug button:first-child{border-top:0}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{position:relative}
.days input{position:absolute;opacity:0;width:1px;height:1px}
.days span{display:inline-flex;min-width:46px;height:40px;align-items:center;justify-content:center;border-radius:12px;border:1px solid #CDD3BD;font-weight:600;font-size:14px;cursor:pointer;color:var(--old)}
.days input:checked + span{background:var(--ol);border-color:var(--ol);color:#fff}
.days input:focus-visible + span{outline:2px solid var(--ink)}
.pl{border:1px solid var(--ln);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pl .grid3 input{min-height:44px}
.money{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const VERSAO = '1.5';
const PEDIDOS = false; // pedidos ficam no Mercos
// ponte opcional no Termux (OneDrive automático e leitura de prints mais precisa)
const PONTE = (location.hostname === '127.0.0.1' || location.hostname === 'localhost') && location.port === '8765' ? '' : 'http://127.0.0.1:8765';
const ST = {
  aguardando: { label: 'Aguardando', fg: '#374151', bg: '#E5E7EB', rank: 0 },
  armazenando: { label: 'Armazenando', fg: '#92400E', bg: '#FEF3C7', rank: 1 },
  disponivel: { label: 'Disponível', fg: '#166534', bg: '#DCFCE7', rank: 2 },
  ofertado: { label: 'Ofertado', fg: '#1E40AF', bg: '#DBEAFE', rank: 3 },
  vendido: { label: 'Vendido', fg: '#FFFFFF', bg: '#3E4F20', rank: 4 },
  cancelado: { label: 'Cancelado', fg: '#4B5563', bg: '#F3F4F6', rank: 5 }
};
const ORDEM = ['disponivel', 'armazenando', 'aguardando', 'ofertado', 'vendido', 'cancelado'];
const STP = { anotado: { label: 'Anotado', fg: '#374151', bg: '#E5E7EB' }, enviado: { label: 'Enviado', fg: '#1E40AF', bg: '#DBEAFE' }, faturado: { label: 'Faturado', fg: '#166534', bg: '#DCFCE7' } };
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MSG_DISP = 'Olá{comprador}! Boa notícia: os produtos que você pediu já estão disponíveis na Ramada:\n{lista}\n\nPosso incluir no seu pedido?';
const MSG_ARM = 'Olá{comprador}! Os produtos que você pediu já chegaram na Ramada e estão em liberação para venda:\n{lista}\n\nAssim que liberar te aviso. Quer que eu já deixe no seu próximo pedido?';
const I = {
  home: '<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9v11h18V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/>',
  truck: '<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9z"/>',
  plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  wa: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5.1A8 8 0 1 1 21 12z"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  x: '<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.5 11h11L21 8H6.2"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7"/>',
  route: '<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  up: '<path d="M6 15l6-6 6 6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  msg: '<path d="M4 5h16v11H8l-4 4z"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'
};
const svg = (p, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

let srv = { online: false, onedrive: false, ultimoSync: null, erroSync: null, ocr: false, versao: VERSAO };
const items = new Map();
const S = {
  tab: 'inicio', sub: null, cli: null, cliTab: 'faltas', filtro: 'disponivel', busca: '', buscaCli: '', buscaCat: '', nota: '',
  loaded: false, dbErr: null, modal: null,
  imp: { status: 'disponivel', fase: 'idle', res: null, match: null, sel: new Set(), erro: null, texto: '', mostraTexto: false, progresso: '' }
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const normCode = s => String(s || '').replace(/\D/g, '').replace(/^0+/, '');
const now = () => new Date().toISOString();
const dm = iso => { if (!iso) return ''; const d = new Date(iso); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); };
const hm = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const dataISO = (n = 0) => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const newId = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pl = (n, a, b) => n === 1 ? a : b;
const sameMonth = iso => { if (!iso) return false; const a = new Date(iso), b = new Date(); return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); };
const diasDesde = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 864e5) : null;
const groupBy = (arr, k) => { const m = new Map(); arr.forEach(x => { const v = x[k] || '_'; if (!m.has(v)) m.set(v, []); m.get(v).push(x); }); return m; };
const chip = st => { const s = ST[st] || ST.aguardando; return `<span class="chip" style="color:${s.fg};background:${s.bg}">${s.label}</span>`; };
const chipP = st => { const s = STP[st] || STP.anotado; return `<span class="chip" style="color:${s.fg};background:${s.bg}">${s.label}</span>`; };
const reais = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const numBR = s => { const v = parseFloat(String(s || '').replace(/\./g, '').replace(',', '.')); return isNaN(v) ? 0 : v; };
const fmtNum = v => v ? String(v).replace('.', ',') : '';
const vibrar = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) { } };

const all = () => [...items.values()];
const doTipo = k => all().filter(x => x.kind === k);
const clientes = () => doTipo('cliente').sort((a, b) => norm(a.nome).localeCompare(norm(b.nome)));
const faltas = () => doTipo('falta');
const pedidos = () => doTipo('pedido').sort((a, b) => (b.em || '').localeCompare(a.em || ''));
const produtos = () => doTipo('produto');
const imps = () => doTipo('imp').sort((a, b) => (b.em || '').localeCompare(a.em || ''));
const cli = id => items.get(id);
const cfg = () => items.get('cfg') || {};
const prodPorCodigo = c => { const k = normCode(c); return k ? items.get('p_' + k) : null; };
const roteiro = (d) => items.get('rot_' + (d || hojeISO()));
const endCompleto = c => [c.endereco, c.cidade].filter(Boolean).join(', ');
const mapsBusca = c => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(endCompleto(c));
function mapsRota(lista) {
  const ends = lista.filter(c => c && c.endereco).map(endCompleto).slice(0, 4); if (!ends.length) return '';
  const dest = ends.pop();
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(dest) + (ends.length ? '&waypoints=' + encodeURIComponent(ends.join('|')) : '');
}
const freqDe = c => Number(c.freq) || Number(cfg().freq) || 14;
const atraso = c => { const d = diasDesde(c.ultimaVisita); return d === null ? 999 : d - freqDe(c); };

/* ---------- dados no celular (IndexedDB) ---------- */
let idb = null;
const meta = { pendente: false, ultimoEnvio: null, ultimoOneDrive: null, ultimoCompartilhado: null };
function abrirIDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('representante', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('itens')) d.createObjectStore('itens', { keyPath: 'id' }); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbReq(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = idb.transaction(store, mode); let out;
    const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };

/* ---------- ponte com o Termux (opcional) ---------- */
async function api(method, path, body, raw, ms) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 120000);
  const opt = { method, headers: {}, signal: ctl.signal, mode: 'cors' };
  if (PONTE) opt.targetAddressSpace = 'loopback';
  if (body !== undefined) { if (raw) { opt.body = body; if (body.type) opt.headers['Content-Type'] = body.type; } else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; } }
  try {
    const r = await fetch(PONTE + path, opt); let j = {};
    try { j = await r.json(); } catch (e) { }
    if (!r.ok) throw new Error(j.erro || ('erro ' + r.status));
    return j;
  } finally { clearTimeout(t); }
}
async function status() {

}
async function compartilharArquivo(nome, blob, titulo) {
  const file = new File([blob], nome, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: titulo }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  baixar(nome, blob); return true;
}

function vCliente() {
  const c = cli(S.cli); const mine = faltas().filter(f => f.clienteId === c.id);
  const disp = mine.filter(f => f.status === 'disponivel');
  const tel = String(c.telefone || '').replace(/\D/g, '');
  const dv = diasDesde(c.ultimaVisita);
  const peds = pedidos().filter(p => p.clienteId === c.id);
  let h = `${barra('', 'backCli', `<button class="ibtn" data-act="editCli" data-id="${esc(c.id)}" aria-label="Editar cliente">${svg(I.edit, 22)}</button>`)}
  <section class="card stack" style="gap:10px">
    <div><h1 style="font-size:24px">${esc(c.nome)}</h1>
      <p class="sub">${esc([c.cidade, c.comprador ? 'Comprador: ' + c.comprador : ''].filter(Boolean).join(' · '))}</p>
      <p class="sub">${dv === null ? 'Nenhuma visita registrada' : 'Última visita: ' + dm(c.ultimaVisita) + (dv === 0 ? ' (hoje)' : ' (há ' + dv + ' ' + pl(dv, 'dia', 'dias') + ')')}${(c.diasVisita || []).length ? ' · visita: ' + c.diasVisita.map(i => DIAS[i]).join(', ') : ''}</p>
      ${c.endereco ? `<p class="sub">${esc(c.endereco)}</p>` : ''}${c.telefone ? `<p class="sub">${esc(c.telefone)}</p>` : ''}</div>
    <div class="grid3">${tel ? `<a class="btn sm" href="${esc(waLink(c))}" target="_blank" rel="noopener">${svg(I.wa, 18)}WhatsApp</a><a class="btn sm" href="tel:${esc(tel)}">${svg(I.phone, 18)}Ligar</a>` : `<button class="btn sm" data-act="editCli" data-id="${esc(c.id)}" style="grid-column:span 2">Adicionar telefone</button>`}<button class="btn sm pri" data-act="registrarVisita" data-id="${esc(c.id)}">${svg(I.check, 18)}Visitei</button></div>
    <div class="grid2"><button class="btn sm tint" data-act="novaFalta" data-id="${esc(c.id)}">${svg(I.plus, 18)}Registrar falta</button>${PEDIDOS ? `<button class="btn sm tint" data-act="novoPedido" data-id="${esc(c.id)}">${svg(I.cart, 18)}Pedido</button>` : (endCompleto(c) && c.endereco ? `<a class="btn sm tint" href="${esc(mapsBusca(c))}" target="_blank" rel="noopener">${svg(I.route, 18)}Ver no Maps</a>` : `<button class="btn sm tint" data-act="editCli" data-id="${esc(c.id)}">${svg(I.route, 18)}Pôr endereço</button>`)}</div>
  </section>`;
  if (disp.length) h += `<section class="hero stack" style="margin-top:12px;gap:10px"><span class="eyebrow">Ofereça nesta visita</span><h2 style="color:#fff">${disp.length} ${pl(disp.length, 'produto liberado', 'produtos liberados')}</h2><div class="grid2"><a class="btn wa sm" href="${esc(waLink(c, disp, 'disp'))}" target="_blank" rel="noopener">${svg(I.wa, 18)}Avisar</a><button class="btn sm" data-act="ofertarCli" data-id="${esc(c.id)}">Ofereci tudo</button></div></section>`;
  const tabs = [['faltas', `Faltas (${mine.filter(f => !['vendido', 'cancelado'].includes(f.status)).length})`], ['pedidos', `Pedidos (${peds.length})`], ['visitas', 'Visitas e notas']].filter(([k]) => PEDIDOS || k !== 'pedidos');
  h += `<div class="seg" role="group" aria-label="Seções do cliente" style="margin-top:14px">${tabs.map(([k, l]) => `<button data-act="cliTab" data-t="${k}" aria-pressed="${S.cliTab === k}">${l}</button>`).join('')}</div><div class="stack" style="margin-top:12px">`;
  if (S.cliTab === 'faltas') {
    if (!mine.length) h += `<div class="empty">Nenhuma falta registrada para este cliente.</div>`;
    for (const k of ORDEM) {
      const l = mine.filter(f => f.status === k).sort((a, b) => (b.atualizadoEm || '').localeCompare(a.atualizadoEm || ''));
      if (!l.length) continue;
      h += `<span class="eyebrow" style="margin-top:4px">${ST[k].label} · ${l.length}</span>${l.map(f => faltaCard(f, false)).join('')}`;
    }
  } else if (S.cliTab === 'pedidos') {
    if (!peds.length) h += `<div class="empty">Nenhum pedido anotado para este cliente.</div>`;
    else { const tot = peds.reduce((s, p) => s + (Number(p.total) || 0), 0); h += `<p class="hint" style="margin:0">${peds.length} ${pl(peds.length, 'pedido', 'pedidos')} · total ${reais(tot)}</p>${peds.map(p => pedidoCard(p, false)).join('')}`; }
  } else {
    const vis = (Array.isArray(c.visitas) ? c.visitas : []).slice().reverse();
    const notas = Array.isArray(c.notas) ? c.notas : [];
    h += `<span class="eyebrow">Anotações</span>
      ${notas.map((n, i) => ({ n, i })).reverse().map(({ n, i }) => `<div class="note"><div><small>${dm(n.em)}</small><div style="font-size:14px;line-height:1.45;margin-top:4px;white-space:pre-wrap">${esc(n.txt)}</div></div><button class="ibtn" data-act="delNota" data-i="${i}" aria-label="Apagar anotação">${svg(I.x, 18)}</button></div>`).join('')}
      <label class="f"><span class="sr">Nova anotação</span><textarea id="notaTxt" data-in="nota" class="inp" placeholder="Ex.: comprador prefere visita na terça; pagamento 28/35 dias">${esc(S.nota)}</textarea></label>
      <button class="btn" data-act="addNota">Salvar anotação</button>
      <span class="eyebrow" style="margin-top:8px">Visitas</span>
      ${vis.length ? `<div class="card" style="padding:4px 14px">${vis.slice(0, 30).map(v => `<div class="line"><span>${new Date(v.em).toLocaleDateString('pt-BR')} ${hm(v.em)}</span><span class="hint" style="text-align:right">${esc(v.obs || '')}</span></div>`).join('')}</div>` : `<div class="empty">Nenhuma visita registrada.</div>`}
      <button class="btn danger" data-act="delCli" data-id="${esc(c.id)}" style="margin-top:16px">Excluir cliente</button>`;
  }
  return h + '</div>';
}

function vChegadas() {
  const im = S.imp;
  let h = `${barra('Chegadas')}<p class="sub" style="margin:-4px 0 14px">Mande o print do grupo da Ramada. O app lê os códigos, encontra quem estava esperando e guarda os produtos no catálogo.</p><div class="stack">
  <section class="card stack">
    <span class="eyebrow">1. O que diz o print?</span>
    <div class="seg" role="group" aria-label="Situação dos produtos do print">

      <button data-act="impStatus" data-s="disponivel" aria-pressed="${im.status === 'disponivel'}">Disponível p/ venda</button>
    </div>
    <span class="eyebrow" style="margin-top:6px">2. Envie o print</span>
    <label class="btn pri block" style="cursor:pointer">${svg(I.image, 20)}Escolher print(s) da galeria<input id="impFile" type="file" accept="image/*" multiple class="sr"></label>
    <span class="hint">Dica: no WhatsApp, abra o print, toque em compartilhar e escolha <b>Representante</b>.</span>
    <button class="btn ghost sm" data-act="impTexto" style="align-self:flex-start">${im.mostraTexto ? 'Fechar texto' : 'Ou colar/digitar códigos'}</button>
    ${im.mostraTexto ? `<label class="f"><span class="sr">Texto da mensagem</span><textarea id="impTxt" data-in="impTexto" class="inp" placeholder="Um código por linha, ou cole a lista">${esc(im.texto)}</textarea></label><button class="btn" data-act="impLerTexto">Ler texto</button>` : ''}
  </section>`;
  if (im.erro) h += `<div class="card" style="border-color:#F1B4B4;background:#FEF2F2"><div class="t" style="color:#991B1B">${esc(im.erro)}</div></div>`;
  if (im.fase === 'lendo') h += `<div class="card row" style="gap:12px"><span class="spin"></span><span>${esc(im.progresso || 'Lendo o print…')}</span></div>`;
  if ((im.fase === 'pronto' || im.fase === 'salvando') && im.res) {
    const { exatos, possiveis, marcas } = im.match; const r = im.res; const nSel = im.sel.size;
    const novos = r.produtos.filter(p => normCode(p.codigo) && !prodPorCodigo(p.codigo)).length;
    const linha = (x, extra) => { const c = cli(x.f.clienteId) || {}; return `<label class="check"><input type="checkbox" data-chk="${x.f.id}" ${im.sel.has(x.f.id) ? 'checked' : ''}><span><span class="t" style="display:block">${esc(x.f.produto || x.f.codigo)}</span><span class="m" style="display:block">${esc(c.nome || '')}${x.f.codigo ? ' · cód. ' + esc(x.f.codigo) : ''} · ${ST[x.f.status].label} → <b>${ST[im.status].label}</b></span>${extra ? `<span class="m" style="display:block">${extra}</span>` : ''}</span></label>`; };
    h += `<section class="card stack" style="gap:6px"><span class="eyebrow">3. Resultado</span><p class="sub" style="margin:0">Li ${r.produtos.length} ${pl(r.produtos.length, 'produto', 'produtos')}${r.marcas.length ? ' e ' + r.marcas.length + ' ' + pl(r.marcas.length, 'marca', 'marcas') : ''} · marcar como <b>${ST[im.status].label}</b>.${novos ? ` <b>${novos}</b> ${pl(novos, 'produto novo vai', 'produtos novos vão')} para o catálogo.` : ''}</p>`;
    if (exatos.length) h += `<div class="t" style="margin-top:10px;color:#166534">Suas faltas neste print (pelo código) · ${exatos.length}</div>${exatos.map(x => linha(x)).join('')}`;
    if (possiveis.length) h += `<div class="t" style="margin-top:10px">Talvez sejam (pelo nome) · confira</div>${possiveis.map(x => linha(x, 'No print: ' + esc(x.p.descricao + ' ' + (x.p.complemento || '')))).join('')}`;
    if (marcas.length) h += `<div class="t" style="margin-top:10px">Chegou a marca, confira se é o item</div>${marcas.map(x => linha(x, 'Marca no print: ' + esc(x.m))).join('')}`;
    if (!exatos.length && !possiveis.length && !marcas.length) h += `<p class="empty" style="padding:12px 0">Nenhuma das suas faltas em aberto aparece neste print.</p>`;
    h += `<div class="stack" style="margin-top:10px;gap:8px"><button class="btn pri block" data-act="impAplicar" ${im.fase === 'salvando' ? 'disabled' : ''}>${im.fase === 'salvando' ? 'Salvando…' : nSel ? `Atualizar ${nSel} ${pl(nSel, 'falta', 'faltas')}` : 'Registrar chegada'}</button><button class="btn ghost" data-act="impLimpar">Descartar</button></div>
    <details><summary>Ver tudo que foi lido</summary><div style="font-size:13px;line-height:1.6;color:var(--mu)">${r.produtos.map(p => `${esc(p.codigo)} – ${esc(p.descricao)} ${esc(p.complemento || '')}`).join('<br>')}${r.marcas.length ? (r.produtos.length ? '<br><br>' : '') + 'Marcas: ' + r.marcas.map(esc).join(', ') : ''}</div></details>
    ${r.texto ? `<details><summary>Texto bruto da leitura</summary><pre style="font-size:12px;white-space:pre-wrap;color:var(--mu);margin:0">${esc(r.texto)}</pre></details>` : ''}
    <p class="hint" style="margin:0">Confira se os códigos batem com o print. Se faltou algum, use “colar/digitar códigos”.</p></section>`;
  }
  const hs = imps().slice(0, 8);
  if (hs.length) h += `<section class="card stack" style="gap:0"><span class="eyebrow" style="margin-bottom:6px">Últimas chegadas registradas</span>${hs.map(x => `<div class="line"><span>${dm(x.em)} ${hm(x.em)} · ${ST[x.status] ? ST[x.status].label : ''}</span><span class="hint">${x.nProd ? x.nProd + ' prod.' : ''}${x.nMarcas ? ' ' + x.nMarcas + ' marcas' : ''} · ${x.atualizadas || 0} atualiz.</span></div>`).join('')}</section>`;
  return h + '</div>';
}

  <div class="card" style="padding:4px 16px">${mostra.length ? mostra.map(p => `<button class="linkbtn line" data-act="editProduto" data-id="${esc(p.id)}"><span style="min-width:0"><span class="t" style="display:block">${esc(p.descricao)}</span><span class="m" style="display:block">Cód. ${esc(p.codigo)}${p.marca ? ' · ' + esc(p.marca) : ''}${p.preco ? ' · ' + reais(p.preco) : ''}</span></span>${svg(I.chev, 18)}</button>`).join('') : `<div class="empty">${produtos().length ? 'Nada encontrado.' : 'Catálogo vazio. Mande um print de chegada para começar.'}</div>`}</div>

/* ---------- catálogo: autopreenchimento ---------- */
function buscaProdutos(txt, n = 6) {
  const tk = norm(txt).split(' ').filter(Boolean); if (!tk.length) return [];
  const out = [];
  for (const p of produtos()) { const s = norm(p.codigo + ' ' + p.descricao + ' ' + (p.marca || '')); if (tk.every(t => s.includes(t))) { out.push(p); if (out.length >= n) break; } }
  return out;
}
function formFalta() { return document.querySelector('form[data-form="falta"]'); }
function preencherFalta(p) {
  const f = formFalta(); if (!f || !p) return;
  f.codigo.value = p.codigo; f.produto.value = p.descricao; if (!f.marca.value && p.marca) f.marca.value = p.marca;
  const sg = $('#sugProd'); if (sg) sg.innerHTML = '';
  const hh = $('#codHint'); if (hh) hh.textContent = 'Produto preenchido pelo catálogo.';
}

/* ---------- chegadas: leitura e cruzamento ---------- */
function limpar(r) {
  const produtos2 = (Array.isArray(r && r.produtos) ? r.produtos : []).map(p => ({ codigo: String(p.codigo ?? '').trim(), descricao: String(p.descricao ?? '').trim(), complemento: String(p.complemento ?? '').trim() })).filter(p => p.codigo || p.descricao);
  const ms = (Array.isArray(r && r.marcas) ? r.marcas : []).map(m => typeof m === 'string' ? m : (m && (m.parceiro || m.nome)) || '').map(s => String(s).trim()).filter(Boolean);
  return { produtos: produtos2, marcas: [...new Set(ms)] };
}
function nomeBate(a, b) {
  const ta = norm(a).split(' ').filter(t => t.length >= 2); if (ta.length < 2) return false;
  const nb = ' ' + norm(b) + ' ';
  return ta.every(t => nb.includes(' ' + t + ' ') || (t.length >= 4 && nb.includes(t)));
}
function casar(res, status) {
  const alvo = ST[status].rank;
  const abertas = faltas().filter(f => ['aguardando', 'armazenando', 'disponivel'].includes(f.status) && ST[f.status].rank < alvo);
  const mapa = new Map(res.produtos.map(p => [normCode(p.codigo), p]).filter(([k]) => k));
  const exatos = [], possiveis = [], marcas = [], usados = new Set();
  for (const f of abertas) {
    const c = normCode(f.codigo);
    if (c && mapa.has(c)) { exatos.push({ f, p: mapa.get(c) }); usados.add(f.id); continue; }
    if (!c && f.produto) { const p = res.produtos.find(p => nomeBate(f.produto, p.descricao + ' ' + p.complemento)); if (p) { possiveis.push({ f, p }); usados.add(f.id); } }
  }
  for (const f of abertas) {
    if (usados.has(f.id) || !f.marca) continue;
    if (normCode(f.codigo) && res.produtos.length) continue; // print de produtos: se o código não veio, o item não chegou
    const fm = norm(f.marca); if (fm.length < 2) continue;
    const m = res.marcas.find(m => { const nm = norm(m); return nm === fm || (' ' + nm + ' ').includes(' ' + fm + ' ') || (fm.length >= 4 && nm.includes(fm)); });
    if (m) marcas.push({ f, m });
  }
  return { exatos, possiveis, marcas };
}
function mostrarResultado(res) {
  S.imp.res = res; S.imp.fase = 'pronto';
  S.imp.match = casar(res, S.imp.status);
  S.imp.sel = new Set(S.imp.match.exatos.map(x => x.f.id));
}
function carregarScript(src) {
  return new Promise((res, rej) => { if (window.Tesseract) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('leitor indisponível')); document.head.appendChild(s); });
}
async function prepararImagem(file) {
  // mesmo tratamento testado no Termux: cinza, ampliar ~3x e limiar 60%
  const bmp = await createImageBitmap(file);
  const esc3 = Math.max(1, Math.min(3, 2600 / bmp.width));
  const w = Math.round(bmp.width * esc3), h = Math.round(bmp.height * esc3);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d', { willReadFrequently: true }); cx.imageSmoothingQuality = 'high'; cx.drawImage(bmp, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; const v = g < 153 ? 0 : 255; p[i] = p[i + 1] = p[i + 2] = v; }
  cx.putImageData(d, 0, 0);
  return cv;
}
let tessWorker = null;
async function ocrNavegador(file) {
  await carregarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  if (!tessWorker) {
    tessWorker = await Tesseract.createWorker('eng', 1);
    await tessWorker.setParameters({ tessedit_pageseg_mode: '6' });
  }
  const img = await prepararImagem(file);
  const { data } = await tessWorker.recognize(img);
  return { ...lerTextoLocal(data.text || ''), texto: data.text || '', leitor: 'navegador' };
}

}

function lerTextoLocal(txt) {
  const produtos2 = [], marcas = [];
  txt.split(/\n+/).forEach(bruta => {
    const l = bruta.replace(/[|\[\]{}_]+/g, ' ').replace(/\s{2,}/g, ' ').trim(); if (!l) return;
    let m = l.match(/^\D{0,3}?(\d{4,6})\s*(.*)$/);
    if (m) { if (!produtos2.some(p => p.codigo === m[1])) produtos2.push({ codigo: m[1], descricao: m[2].trim(), complemento: '' }); return; }
    m = l.match(/^\D{0,3}?(\d{2,3})\s+([A-Za-zÀ-ÿ].{1,})$/);
    if (m && !marcas.some(x => norm(x) === norm(m[2]))) marcas.push(m[2].trim());
  });
  return { produtos: produtos2, marcas };
}
function aprenderCatalogo(res) {

    const desc = [p.descricao, p.complemento].filter(Boolean).join(' ').replace(/\s{2,}/g, ' ').trim(); if (!desc) continue;
    const ex = items.get('p_' + k);
    if (ex && ex.descricao === desc && (ex.marca || !marca1)) continue;
    novos.push({ ...(ex || {}), id: 'p_' + k, kind: 'produto', codigo: p.codigo.replace(/^0+/, '') || p.codigo, descricao: ex && ex.manual ? ex.descricao : desc, marca: (ex && ex.marca) || marca1, aprendidoEm: (ex && ex.aprendidoEm) || now() });
  }
  return novos;
}

      const c = cfg(); await save('cfg', { ...c, kind: 'cfg', freq: Number(o.freq) || 14 }); toast('Frequência salva');
    }
  } catch (err) { if (btn) btn.disabled = false; toast('Não consegui salvar no celular. Tente de novo.'); }
});

/* ---------- início ---------- */
async function receberCompartilhados() {
  if (!location.search.includes('compartilhado')) return;
  history.replaceState(null, '', location.pathname);
  let files = null;
  try { files = await metaGet('compartilhados'); await metaSet('compartilhados', null); } catch (e) { }
  if (files && files.length) lerArquivos(files);
  else { S.tab = 'chegadas'; render(); toast('Não recebi o print. Tente escolher pela galeria.'); }
}
async function init() {
  render();
  try {
    idb = await abrirIDB();
    await recarregar();
    for (const k of ['pendente', 'ultimoEnvio', 'ultimoOneDrive', 'ultimoCompartilhado']) { try { const v = await metaGet(k); if (v !== undefined) meta[k] = v; } catch (e) { } }
    S.loaded = true; S.dbErr = null;
  } catch (e) { S.dbErr = 'idb'; render(); return; }
  render();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
  await status();
  if (srv.online && meta.pendente) await enviarTermux();
  render();
  receberCompartilhados();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
setInterval(async () => { if (!S.loaded) return; await status(); if (srv.online && meta.pendente) await enviarTermux(); if (S.tab === 'inicio' || (S.tab === 'mais' && S.sub === 'backup')) { if (!S.modal) render(); } }, 30000);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.loaded) return;
  await status(); if (srv.online && meta.pendente) await enviarTermux();
  if (!S.modal) render();
});
init();
</script>
